name: Curbfind
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.nulljosh
settings:
  base:
    # Must live under settings.base -- xcodegen silently drops DEVELOPMENT_TEAM
    # if you put it on a target.
    DEVELOPMENT_TEAM: QMM486NPYC
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Curbfind:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes: ["iOS/**"]
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.curbside
        PRODUCT_NAME: Curbfind
        ENABLE_HARDENED_RUNTIME: YES
        # Without this the Mac build is iconless; iOS auto-detects.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Missing LSApplicationCategoryType is the real cause of ITMS-90242.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Curbfind.entitlements
  Curbfind-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Models
      - path: Sources/Views
      - path: Sources/iOS
      - path: Resources
        buildPhase: resources
        excludes: ["Curbfind.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.curbside
        PRODUCT_NAME: Curbfind
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Hand-written plist purely because UILaunchScreen is a dict and no
        # INFOPLIST_KEY_* can express it; without it the app runs letterboxed.
        INFOPLIST_FILE: Curbfind-iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Curbfind-iOS.entitlements
  CurbfindTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Resources/search-fixture.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Curbfind
